name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check all JS
        run: |
          set -e
          for f in $(git ls-files 'server/**/*.js' 'public/*.js' 'test/*.js'); do
            node --check "$f"
          done
      - name: Unit tests
        run: npm test
